<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 294 76" width="100%" height="100%">
  <!-- CRESCENT MOON (Centrada en la mitad exacta: x=147) -->
  <g id="moon" transform="rotate(-15 147 12)">
    <!-- White crescent base -->
    <circle cx="147" cy="12" r="10.5" fill="#FFFFFF" />
    <!-- Black cutout sphere giving crescent shape -->
    <circle cx="150.2" cy="12" r="8.8" fill="#000000" />
  </g>

  <!-- COLONIAL ARCH (R) & STEPS -->
  <!-- Black colonial depth & shadow steps -->
  <path d="M 62 36 L 68 31 L 70 33 L 70 66 L 62 66 Z" fill="#000000" />
  <path d="M 48 67 L 72 67 L 72 71 L 52 71 L 52 75 L 75 75 L 75 76 L 48 76 Z" fill="#000000" />
  
  <!-- Amber Arch -->
  <path d="M 43 67 L 43 38 A 9.5 9.5 0 0 1 62 38 L 62 67 Z" fill="#F8AD00" />
  
  <!-- White R inside arch -->
  <path d="M 47.5 44 L 54 44 C 57 44 58.5 45.5 58.5 48 C 58.5 50.2 57 51.5 54.5 51.8 L 59 62 L 55 62 L 51.2 53.5 L 50.5 53.5 L 50.5 62 L 47.5 62 Z M 50.5 46.5 L 50.5 51 L 53.5 51 C 55 51 55.8 50.2 55.8 48.8 C 55.8 47.2 55 46.5 53.5 46.5 Z" fill="#FFFFFF" />

  <!-- SERENO INLINE LETTERS (Gold #F8AD00) -->
