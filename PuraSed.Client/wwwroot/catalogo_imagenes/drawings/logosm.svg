  <!-- First E -->
  <g stroke="#F8AD00" fill="none">
    <path d="M 35 38.5 L 22.5 38.5 L 22.5 61.5 L 35 61.5 M 22.5 50 L 32 50" stroke-width="2.6" stroke-linecap="square" />
    <path d="M 33 41.5 L 25.5 41.5 L 25.5 58.5 L 33 58.5 M 25.5 50 L 30 50" stroke-width="1.2" stroke-linecap="square" />
  </g>

  <!-- Second E -->
  <g stroke="#F8AD00" fill="none">
    <path d="M 82 38.5 L 69.5 38.5 L 69.5 61.5 L 82 61.5 M 69.5 50 L 79 50" stroke-width="2.6" stroke-linecap="square" />
    <path d="M 80 41.5 L 72.5 41.5 L 72.5 58.5 L 80 58.5 M 72.5 50 L 77 50" stroke-width="1.2" stroke-linecap="square" />
  </g>

  <!-- N -->
  <g stroke="#F8AD00" fill="none">
    <path d="M 90 61.5 L 90 38.5 L 106 61.5 L 106 38.5" stroke-width="2.6" stroke-linecap="square" />
    <path d="M 93 58.5 L 93 42.5 L 103 57.5 L 103 41.5" stroke-width="1.2" stroke-linecap="square" />
  </g>

  <!-- O (Concentric rings) -->
  <g stroke="#F8AD00" fill="none">
    <circle cx="125.5" cy="50" r="11.5" stroke-width="2.6" />
    <circle cx="125.5" cy="50" r="6" stroke-width="1.4" />
  </g>

  <!-- MORENO SOLID BADGE -->
  <!-- Black Container Box -->
  <rect x="150" y="32" width="144" height="34" fill="#000000" />

  <!-- Pure Vector Geometric Paths for MORENO in White #FFFFFF -->
  <g id="moreno-letters" fill="#FFFFFF">
    <!-- M -->
    <path d="M 154 37 L 158.5 37 L 165.5 52.5 L 172.5 37 L 177 37 L 177 60 L 173 60 L 173 43.5 L 167 56.5 L 164 56.5 L 158 43.5 L 158 60 L 154 60 Z" />

    <!-- First O (outer circle minus inner hole) -->
    <path fill-rule="evenodd" d="M 192 37 C 198.6 37 204 42.4 204 48.5 C 204 54.6 198.6 60 192 60 C 185.4 60 180 54.6 180 48.5 C 180 42.4 185.4 37 192 37 Z M 192 41.5 C 188 41.5 184.8 44.7 184.8 48.5 C 184.8 52.3 188 55.5 192 55.5 C 196 55.5 199.2 52.3 199.2 48.5 C 199.2 44.7 196 41.5 192 41.5 Z" />

    <!-- R -->
