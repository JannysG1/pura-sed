    <!-- E -->
    <path d="M 227 37 L 241 37 L 241 41.5 L 231.5 41.5 L 231.5 46.5 L 239.5 46.5 L 239.5 50.5 L 231.5 50.5 L 231.5 55.5 L 241 55.5 L 241 60 L 227 60 Z" />

    <!-- N -->
    <path d="M 245 37 L 249.5 37 L 259.5 53.5 L 259.5 37 L 263.5 37 L 263.5 60 L 259 60 L 249 43.5 L 249 60 L 245 60 Z" />

    <!-- Second O (outer circle minus inner hole) -->
    <path fill-rule="evenodd" d="M 279 37 C 285.6 37 291 42.4 291 48.5 C 291 54.6 285.6 60 279 60 C 272.4 60 267 54.6 267 48.5 C 267 42.4 272.4 37 279 37 Z M 279 41.5 C 275 41.5 271.8 44.7 271.8 48.5 C 271.8 52.3 275 55.5 279 55.5 C 283 55.5 286.2 52.3 286.2 48.5 C 286.2 44.7 283 41.5 279 41.5 Z" />
  </g>
</svg>